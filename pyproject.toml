[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-muse"
version = "0.1.0"
description = "Talk to Muse through a Reachy Mini robot, with an optional Mac companion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# For a local SDK checkout, install it first: pip install -e ../muse-gadget-sdk/linux
dependencies = [
    "musegadget @ git+https://github.com/facebookincubator/muse-gadget-sdk@4737636133c9a0253d0b778333605b16fd2626c1#subdirectory=linux",
]

[project.scripts]
muse-reachy = "reachy_muse.cli:main"
reachy-companion = "reachy_muse.companion_server.cli:main"

[project.optional-dependencies]
test = ["pytest"]
robot = ["reachy-mini>=1.9,<2", "numpy>=1.24", "av>=12", "webrtcvad-wheels>=2.0.14"]
wake = ["sherpa-onnx==1.13.8", "sentencepiece==0.2.2"]
wake-vosk = ["vosk==0.3.45"]
stt-streaming = ["sherpa-onnx==1.13.8"]
# Pinned to the versions mac-speech-bench-2 measured, on Apple Silicon.
companion-server = [
    "cryptography>=41",
    "mlx==0.32.3",
    "mlx-audio==0.5.7",
    "parakeet-mlx==0.5.3",
    "transformers==5.18.0",
    "huggingface-hub==1.33.0",
    "mlx-lm==0.32.0",
    "onnxruntime>=1.20",
    "numpy>=2",
    "soxr==1.1.0",
    "misaki[en]==0.9.4",
    "num2words",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# reachy-companion serve --motion: the versions bench/motion.md measured. Shared pins match companion-server.
companion-motion = [
    "reachy-motion-generator @ git+https://github.com/pham-tuan-binh/reachy-motion-generator@96497d69a31cc89da209f224bd9c1fee1834b864",
    "torch==2.14.1",
    "scipy==1.18.1",
    "numpy>=2",
    "reachy-mini-rust-kinematics==1.0.3",
    "mlx==0.32.3",
    "mlx-lm==0.32.0",
    "transformers==5.18.0",
    "huggingface-hub==1.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reachy_muse = ["data/face_tracking/*", "data/arrival/*", "data/companion_protocol_v1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real'"
markers = ["real: runs the real speech models over a WebSocket; slow, Apple Silicon only (pytest -m real)"]
